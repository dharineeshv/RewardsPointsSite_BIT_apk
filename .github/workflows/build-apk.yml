name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx @capacitor/cli sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Generate & Configure Debug Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Extract & Display SHA-1 & SHA-256 Certificate Fingerprints
        run: |
          echo "=========================================================="
          echo "         ANDROID APK SIGNING CERTIFICATE FINGERPRINTS     "
          echo "=========================================================="
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android
          echo "=========================================================="

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIT-Rewards-Points-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
