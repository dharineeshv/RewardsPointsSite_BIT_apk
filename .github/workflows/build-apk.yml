name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & Generate Certificate Fingerprints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Sync Web Assets to Android (Capacitor)
        run: npx cap sync android

      - name: Setup Keystore & Extract SHA-1 / SHA-256 Fingerprints
        id: cert_fingerprints
        run: |
          mkdir -p android/app
          KEYSTORE_FILE="android/app/debug.keystore"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Creating deterministic debug.keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Rewards BIT, OU=Computer Technology, O=BIT Sathy, C=IN"
          fi

          echo "=========================================================="
          echo "           CERTIFICATE FINGERPRINTS (GOOGLE AUTH)         "
          echo "=========================================================="
          
          SHA1_FP=$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias androiddebugkey -storepass android | grep "SHA1:" | awk '{print $2}')
          SHA256_FP=$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias androiddebugkey -storepass android | grep "SHA256:" | awk '{print $2}')

          echo "SHA-1 Fingerprint:   $SHA1_FP"
          echo "SHA-256 Fingerprint: $SHA256_FP"
          echo "Package Name:        in.bitsathy.rewardspoints"
          echo "=========================================================="

          echo "sha1=$SHA1_FP" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256_FP" >> $GITHUB_OUTPUT

          # Output to GitHub Summary
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 📱 Rewards BIT — Android Build Summary

          ### 🔑 Google OAuth Certificate Fingerprints
          Add these credentials in **Google Cloud Console ➔ APIs & Services ➔ Credentials ➔ Create OAuth client ID ➔ Android**:

          | Parameter | Value |
          | :--- | :--- |
          | **Package Name** | \`in.bitsathy.rewardspoints\` |
          | **SHA-1 Fingerprint** | \`$SHA1_FP\` |
          | **SHA-256 Fingerprint** | \`$SHA256_FP\` |

          ---
          EOF

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew signingReport

      - name: Verify APK Exists & Rename
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "Rewards-BIT.apk"
            echo "APK ready at Rewards-BIT.apk"
          else
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rewards-BIT-APK
          path: Rewards-BIT.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Rewards BIT App v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Rewards BIT — Android Mobile App

            ### 📥 Download
            - **[Rewards-BIT.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/Rewards-BIT.apk)**

            ### 🔑 Google Authentication Configuration
            - **Package Name:** \`in.bitsathy.rewardspoints\`
            - **SHA-1:** \`${{ steps.cert_fingerprints.outputs.sha1 }}\`
            - **SHA-256:** \`${{ steps.cert_fingerprints.outputs.sha256 }}\`
          files: Rewards-BIT.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
